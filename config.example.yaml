# Copy this file to config.yaml and change what you like.
# Every stage has a free local option and a paid cloud option.

# How a turn starts:
#   wakeword      say "Hey Jarvis", then your request (always listening)
#   push_to_talk  press Enter, then speak
#   text          type instead of talking (good for testing)
input_mode: push_to_talk
wakeword_model: hey_jarvis
wakeword_threshold: 0.5

# End-of-speech detection. Raise speech_threshold if background noise keeps it listening.
silence_seconds: 0.9
max_utterance_seconds: 30
speech_threshold: 0.015

# ---------- Personality ----------
# Who you are talking to. Each one has its own instructions and voice:
#   jarvis   calm, dry-witted British butler (Kokoro bm_george)
#   friday   quick, warm and cheeky, Irish turn of phrase (Kokoro bf_isabella)
#   karen    friendly, upbeat and encouraging (Kokoro af_heart)
# The personality's voice wins over the voice under tts below. Change a built-in
# one or add your own under `personalities` (see jarvis/personalities.py), e.g.
#   personalities:
#     friday:
#       tts: {kokoro: {voice: bf_emma}}
personality: jarvis

# ---------- Ears: speech to text ----------
stt_provider: faster_whisper          # local, free  |  deepgram (paid, fastest)
stt:
  faster_whisper:
    model: distil-large-v3            # accurate and fast on an RTX 3070/4070. Use small.en on CPU-only PCs
    device: auto                      # auto | cuda | cpu
    compute_type: default             # float16 on NVIDIA, int8 on CPU
  deepgram:
    model: nova-3

# ---------- Brain: Claude ----------
# agent              Claude with tools, can go and do things. Uses your Claude
#                    subscription after `claude login`, or ANTHROPIC_API_KEY.
# chat               Claude API, talk only, a bit faster. Needs ANTHROPIC_API_KEY.
# openai_compatible  DeepSeek, OpenRouter, Groq, Ollama and others. Talk only, no tools.
brain_provider: agent
brain:
  agent:
    model: claude-opus-5-5
    # Tools Jarvis may use without asking. Add "Bash", "Write" and "Edit" to let it
    # run commands and change files, only in a folder you are happy for it to touch.
    allowed_tools: [WebSearch, WebFetch, Read, Glob, Grep]
    permission_mode: default
    cwd: null                         # folder it works in, e.g. C:/Users/you/jarvis-workspace
    max_turns: 25
    max_budget_usd: 1.0               # stops a single request from spending more than this
  chat:
    model: claude-opus-5-5
    effort: low                       # low keeps spoken replies quick
  openai_compatible:
    base_url: https://api.deepseek.com
    model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY     # name of the .env variable holding the key
    # Local Ollama instead: base_url: http://localhost:11434/v1, model: llama3.1, api_key_env: null

# ---------- Voice: text to speech ----------
tts_provider: kokoro                  # kokoro | csm | elevenlabs | openai | system | print
tts:
  kokoro:                             # local, free, fast even without a GPU
    voice: bm_george                  # used when the personality has no Kokoro voice of its own
    speed: 1.0
  csm:                                # local Sesame CSM-1B, most human-sounding local option. Fits on a 4070 (12 GB) or 3070 (8 GB)
    model_id: sesame/csm-1b
    device: auto
  elevenlabs:                         # paid, most natural
    voice_id: JBFqnCBsd6RMkjVDRZzb    # "George". Find others at elevenlabs.io/app/voice-library
    model_id: eleven_flash_v2_5
  openai:                             # paid, cheap, tone is steerable
    model: gpt-4o-mini-tts
    voice: onyx
    instructions: Speak like a calm, witty British butler.
  system: {}                          # built-in Windows voice, robotic but no setup

# system_prompt: |
#   Replaces every personality's instructions. Usually better to edit a personality.
